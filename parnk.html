<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Me!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: fadeIn 0.6s ease-in;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(-1px);
        }

        .prank-message {
            display: none;
            margin-top: 30px;
            animation: popIn 0.5s ease-out;
        }

        .prank-message h2 {
            font-size: 2em;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        .prank-message p {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Click Me! 🎉</h1>
        <button class="button" onclick="triggerPrank()">Click Here!</button>
        
        <div class="prank-message" id="prankMessage">
            <div class="emoji">😂😂😂😂</div>
            <h2>I Just Wasted Your Time! 🤣</h2>
            <p>Ha! Got you! You fell for it!</p>
            <button class="button" onclick="location.reload()">Try Again?</button>
        </div>
    </div>

    <script>
        function triggerPrank() {
            // Hide the button and show the prank message
            document.querySelector('.button').style.display = 'none';
            document.getElementById('prankMessage').style.display = 'block';
            
            // Create confetti effect
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#667eea', '#764ba2', '#f9ca24', '#6c5ce7'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    
                    let top = 0;
                    const speed = Math.random() * 3 + 2;
                    const drift = (Math.random() - 0.5) * 2;
                    
                    const fall = setInterval(() => {
                        top += speed;
                        confetti.style.top = top + 'px';
                        confetti.style.left = (parseInt(confetti.style.left) + drift) + 'px';
                        confetti.style.opacity = 1 - (top / window.innerHeight);
                        
                        if (top > window.innerHeight) {
                            clearInterval(fall);
                            confetti.remove();
                        }
                    }, 20);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
